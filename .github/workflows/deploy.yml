name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy To OCI

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}

          script: |
            cd /opt/ticket-system

            git pull origin main

            docker compose down

            docker compose up -d --build
