# Static SPA host for the Five Two Supports ticketing frontend.
# Serves the hashed Vite build and reverse-proxies the API + Socket.IO to the
# backend service (named `api` on the shared Docker network).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS — resolve backend hostnames at request time so this
  # container starts even if the backend isn't up yet.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Reasonable security headers (HSTS/CSP are best terminated at the edge proxy).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  client_max_body_size 25m; # match the backend's attachment limit

  # Hashed, immutable build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # REST API → backend.
  location /api/ {
    set $api_upstream api:4000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.IO (WebSocket upgrade) → backend.
  location /socket.io/ {
    set $sock_upstream api:4000;
    proxy_pass http://$sock_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # SPA history fallback — every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the HTML entrypoint so new deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
